[project]
name = "pkp"
version = "0.1.0"
description = "Personal Knowledge Pipeline - ingestion, retrieval, and proposal system"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "PKP Developer", email = "dev@pkp.local"}
]
keywords = ["knowledge-management", "retrieval", "ingestion", "pkm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "click>=8.1.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "toml>=0.10.2",
    "trafilatura>=1.12.0",
    "docling>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "FlagEmbedding>=1.2.0",
    "qdrant-client>=1.17.0",
    "torch>=2.0.0",
    "transformers>=4.30,<5",
]

[project.scripts]
pkp = "pkp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "types-toml",
    "bandit>=1.9.4",
    "radon",
    "xenon",
    "pip-audit",
    "pre-commit",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "D"]
ignore = ["E501", "D100", "D107", "UP017"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".cache", "__pycache__"]
skips = ["B101"]

[tool.radon]
exclude = ["tests", ".cache"]
cc_min = "C"
